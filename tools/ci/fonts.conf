<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The generic families of the machine models/text/linux-widths.json was recorded on (its "resolved" table): Firefox and
     WebKit ask fontconfig, and resolved sans-serif and system-ui to Inter there; a stock Ubuntu runner gives DejaVu Sans.
     (Default bindings: a strong one also rebinds a missing family listed before a generic one, and WebKit then drew
     "Qwzxv, monospace" unlike "monospace".)
     Chromium resolves sans-serif to Liberation Sans through its own Arial default. Installed by tools/ci/install-fonts.sh. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
