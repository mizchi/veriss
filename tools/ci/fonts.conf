<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The generic families of the machine models/text/linux-widths.json was recorded on (its "resolved" table): Firefox and
     WebKit ask fontconfig, and resolved sans-serif and system-ui to Inter there; a stock Ubuntu runner gives DejaVu Sans.
     Chromium resolves sans-serif to Liberation Sans through its own Arial default. Installed by .github/workflows/ci.yml. -->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
