# The safe-subset differential fuzz (e2e/layout-fuzz-safe-subset.spec.mjs) at a size a pull request cannot afford:
# every night with the defaults, or by hand:
#   gh workflow run fuzz.yml -f cases=5000 -f seeds=7 -f browsers=webkit
# A mismatch fails the job; the shrunk cases are in the job log and in the fuzz-<browser>-<seed> artifact.
name: fuzz
on:
  schedule:
    - cron: '17 18 * * *'   # 03:17 JST
  workflow_dispatch:
    inputs:
      cases:
        description: Seeded pages per run (FUZZ_CASES)
        default: '5000'
      seeds:
        description: Comma-separated seeds (FUZZ_SEED), one run each
        default: '1,2,3'
      browsers:
        description: Comma-separated Playwright projects
        default: 'chromium,firefox,webkit'
      first:
        description: First case index (FUZZ_FIRST)
        default: '0'
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.plan.outputs.seeds }}
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - id: plan
        env:
          SEEDS: ${{ inputs.seeds || '1,2,3' }}
          BROWSERS: ${{ inputs.browsers || 'chromium,firefox,webkit' }}
        run: |
          list() { node -e 'console.log(JSON.stringify(process.argv[1].split(",").map(s => s.trim()).filter(Boolean)))' "$1"; }
          echo "seeds=$(list "$SEEDS")" >> "$GITHUB_OUTPUT"
          echo "browsers=$(list "$BROWSERS")" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    env:
      FUZZ_CASES: ${{ inputs.cases || '5000' }}
      FUZZ_SEED: ${{ matrix.seed }}
      FUZZ_FIRST: ${{ inputs.first || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the recorded Linux fonts
        run: tools/ci/install-fonts.sh
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Fuzz
        run: |
          set -o pipefail
          mkdir -p fuzz-out
          npx playwright test -c playwright.layout.config.mjs e2e/layout-fuzz-safe-subset.spec.mjs \
            --project ${{ matrix.browser }} --trace off --reporter list 2>&1 | tee fuzz-out/fuzz.log
      # The spec prints one tally line per run: "safe-subset fuzz (<browser>, seed <s>, <a>..<b>): {...}; decided cases N%, ...".
      - name: Summary
        if: success() || failure()
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          node tools/ci/fuzz-summary.mjs parse fuzz-out/fuzz.log "$BROWSER" "$FUZZ_SEED" > fuzz-out/summary.json
          node tools/ci/fuzz-summary.mjs table fuzz-out/summary.json >> "$GITHUB_STEP_SUMMARY"
          if grep -qE 'Error: seed [0-9]+ index [0-9]+: ' fuzz-out/fuzz.log; then
            { echo; echo '### Shrunk cases'; echo '```'; grep -A4 -E 'Error: seed [0-9]+ index [0-9]+: ' fuzz-out/fuzz.log | head -100; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: fuzz-${{ matrix.browser }}-${{ matrix.seed }}
          path: |
            fuzz-out/
            test-results/
          retention-days: 30

  summary:
    needs: fuzz
    if: always() && needs.fuzz.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: fuzz-*
          path: runs
      - name: Decided share per run
        run: |
          { echo '## safe-subset fuzz'; node tools/ci/fuzz-summary.mjs table runs/*/fuzz-out/summary.json; } >> "$GITHUB_STEP_SUMMARY"
