name: release

# Push a v* tag to publish veriss (packages/veriss; the adapters stay private for now).
# The npm side trusts this workflow by filename:
#   npm trust github veriss --repo mizchi/veriss --file release.yml --allow-publish
# No NPM_TOKEN: npm authenticates through OIDC and attaches provenance.
#
# Three jobs, so the OIDC token is never in reach of dependency code: `test` installs the
# workspace (and runs its lifecycle scripts) with no id-token; `publish` holds id-token but installs
# nothing (the package ships its sources, nothing is built) and publishes with --ignore-scripts;
# `release` writes the GitHub release.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches the package version
        run: |
          v=$(node -p "require('./packages/veriss/package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "packages/veriss is $v, tag is $GITHUB_REF_NAME"; exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The unit tests of the published package (the browser e2e and the evals are tools/gate.sh, run before a push).
      - run: pnpm --filter veriss test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11
      - name: Publish
        working-directory: packages/veriss
        run: |
          version=${GITHUB_REF_NAME#v}
          case "$version" in
            *-*) npm publish --access public --ignore-scripts --tag next ;;
            *)   npm publish --access public --ignore-scripts ;;
          esac

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/checkout@v6
      - name: GitHub release from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          awk -v h="## $version" '$0 == h || index($0, h" ") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md 2>/dev/null || true
          if grep -q '[^[:space:]]' notes.md; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
        env:
          GH_TOKEN: ${{ github.token }}
